<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="춘양중학교 사제동행 해양과학 캠프 추첨">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>행운의 바다 낚시</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 밤바다 수족관이 화면의 주인공. 학생 이름이 물고기가 되어 헤엄치고, 낚싯바늘이 당첨자를 낚아 올린다. 오른쪽(좁으면 아래)에 경품과 당첨자 목록 */
:root {
  --abyss: #041a2e;   /* 가장 깊은 바다 */
  --deep: #0a3152;
  --tide: #145f8a;
  --foam: #eaf8ff;    /* 글자 */
  --muted: #9fc3d8;
  --line: #1d4a6b;
  --sun: #ffd166;     /* 경품, 당첨 강조 */
  --coral: #ff7a59;   /* 추첨 버튼 */
  --kelp: #3fd18f;
  --panel: #0b2742;
  --f-display: "Jua", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --f-body: "Gowun Dodum", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--abyss); color: var(--foam); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 20px; word-break: keep-all;
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

.app { max-width: 1400px; margin-inline: auto; display: grid; gap: 14px; }
header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 20px; }
.brand { display: grid; gap: 2px; min-width: 0; }
.brand small { color: var(--sun); font-family: var(--f-display); font-size: clamp(15px, 1.6vw, 20px); letter-spacing: .02em; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 4.4vw, 56px); line-height: 1.05; text-wrap: balance; }
.brand h1 span { color: var(--sun); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 15px; }
.chip-btn:hover { border-color: var(--muted); }
.chip-btn[aria-pressed="false"] { color: var(--muted); }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }

/* 수족관 */
.tank {
  position: relative; overflow: hidden; border-radius: 22px; height: min(72vh, 680px); min-height: 380px;
  background:
    radial-gradient(120% 60% at 50% -10%, #2a8ac088 0%, transparent 60%),
    linear-gradient(to bottom, var(--tide) 0%, var(--deep) 45%, var(--abyss) 100%);
  border: 2px solid var(--line); isolation: isolate;
}
.ray { position: absolute; top: -10%; width: 14%; height: 90%; background: linear-gradient(to bottom, #ffffff22, transparent); transform: skewX(-14deg); filter: blur(6px); animation: ray 9s ease-in-out infinite; z-index: 0; }
.sand { position: absolute; left: 0; right: 0; bottom: 0; height: 13%; background: radial-gradient(60% 120% at 30% 100%, #c9a96e55, transparent 70%), radial-gradient(60% 120% at 80% 100%, #c9a96e44, transparent 70%); z-index: 0; }
.weed { position: absolute; bottom: -6px; width: 34px; transform-origin: bottom center; animation: sway 4s ease-in-out infinite; z-index: 1; }
.bubble { position: absolute; bottom: -20px; border-radius: 50%; border: 1.5px solid #ffffffaa; background: radial-gradient(circle at 30% 30%, #ffffffcc 0 15%, #ffffff22 40%, transparent 70%); animation: rise linear infinite; z-index: 1; pointer-events: none; }

.fish { position: absolute; left: 0; top: 0; z-index: 3; will-change: transform; display: grid; justify-items: center; pointer-events: none; }
.fish svg { display: block; width: var(--w, 64px); height: auto; filter: drop-shadow(0 4px 6px #0006); }
.fish .tag { margin-top: -2px; font-family: var(--f-display); font-size: var(--fs, 15px); background: #041a2ecc; border: 1px solid #ffffff33; padding: 1px 9px; border-radius: 999px; white-space: nowrap; }
.fish.flip svg { transform: scaleX(-1); }
.fish.caught .tag { background: var(--sun); color: var(--abyss); border-color: var(--sun); }

.hook { position: absolute; top: 0; left: 0; width: 0; z-index: 4; pointer-events: none; }
.hook .line { position: absolute; left: 0; top: 0; width: 2px; background: #e9f5ffcc; transform: translateX(-1px); }
.hook svg { position: absolute; left: -11px; width: 22px; }

.banner {
  position: absolute; left: 50%; top: 18px; transform: translateX(-50%); z-index: 5; text-align: center;
  font-family: var(--f-display); font-size: clamp(22px, 3vw, 36px); background: #041a2ee6; border: 2px solid var(--sun);
  color: var(--sun); padding: 6px 22px; border-radius: 999px; white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis;
}
.pool-count { position: absolute; left: 16px; bottom: 12px; z-index: 5; font-size: 14px; color: var(--muted); background: #041a2ecc; padding: 3px 10px; border-radius: 999px; }
.empty { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 6px; z-index: 5; font-family: var(--f-display); font-size: 24px; color: var(--muted); }

/* 오른쪽 패널 */
.side { display: grid; gap: 12px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
.label { font-size: 13px; color: var(--muted); letter-spacing: .04em; }
.prize-now { display: grid; gap: 4px; }
.prize-now b { font-family: var(--f-display); font-weight: 400; font-size: 30px; color: var(--sun); line-height: 1.15; }
.prize-now span { color: var(--muted); font-size: 15px; }
.draw {
  font-family: var(--f-display); font-size: 30px; border: 0; border-radius: 20px; padding: 16px 12px; cursor: pointer;
  background: var(--coral); color: #2b0d05; box-shadow: 0 6px 0 #b8492f; transition: transform .1s, box-shadow .1s;
}
.draw:hover { transform: translateY(-1px); }
.draw:active { transform: translateY(4px); box-shadow: 0 2px 0 #b8492f; }
.draw:disabled { background: #6b7f8f; box-shadow: 0 6px 0 #4b5b68; cursor: default; color: #1b2731; }
.hint { font-size: 13px; color: var(--muted); }
.winners { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 300px; overflow-y: auto; }
.winners li { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; padding: 7px 10px; border-radius: 12px; background: var(--deep); }
.winners .n { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; min-width: 22px; }
.winners .who { min-width: 0; }
.winners .who b { font-family: var(--f-display); font-weight: 400; font-size: 19px; }
.winners .who small { display: block; color: var(--sun); font-size: 13px; }
.mini { border: 0; background: none; color: var(--muted); font-size: 12px; text-decoration: underline; cursor: pointer; white-space: nowrap; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }

/* 설정 */
.settings { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 14px; }
.settings h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 24px; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
textarea { width: 100%; min-height: 260px; resize: vertical; background: var(--deep); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; line-height: 1.6; }
.check { display: flex; gap: 8px; align-items: center; }
.check input { width: 18px; height: 18px; accent-color: var(--coral); }
.btn { border: 1px solid var(--line); background: var(--deep); border-radius: 12px; padding: 8px 14px; cursor: pointer; }
.btn.main-btn { background: var(--sun); color: var(--abyss); border-color: var(--sun); font-weight: 700; }
.btn.danger { color: var(--coral); }
.btn.armed { background: var(--coral); color: #2b0d05; border-color: var(--coral); }
.status { font-size: 14px; color: var(--kelp); min-height: 1.2em; }

/* 당첨 공개 */
.reveal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: #020c17cc; padding: 20px; }
.reveal-card {
  position: relative; text-align: center; display: grid; gap: 6px; justify-items: center;
  background: radial-gradient(circle at 50% 0%, #1d6f9f, var(--deep) 70%); border: 3px solid var(--sun); border-radius: 32px;
  padding: clamp(24px, 4vw, 48px) clamp(24px, 6vw, 80px); max-width: min(92vw, 820px);
  animation: popin .7s cubic-bezier(.2,1.6,.4,1) both;
}
.reveal-card .prize { font-family: var(--f-display); color: var(--sun); font-size: clamp(22px, 3vw, 34px); }
.reveal-card .congrats { font-family: var(--f-display); font-size: clamp(20px, 2.4vw, 28px); color: var(--muted); }
.reveal-card .name { font-family: var(--f-display); font-size: clamp(64px, 12vw, 150px); line-height: 1.05; color: var(--foam); text-shadow: 0 6px 0 #0006; }
.reveal-card .grade { font-size: clamp(18px, 2.2vw, 26px); color: var(--muted); }
.reveal-card .fishbig { width: clamp(90px, 12vw, 140px); animation: wiggle 1.2s ease-in-out infinite; }
.reveal-card .close { margin-top: 10px; }
canvas.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

@keyframes ray { 0%, 100% { opacity: .35; transform: skewX(-14deg) translateX(0); } 50% { opacity: .7; transform: skewX(-14deg) translateX(30px); } }
@keyframes sway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(7deg); } }
@keyframes rise { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: .9; } 100% { transform: translateY(-110vh) translateX(20px); opacity: 0; } }
@keyframes popin { from { transform: scale(.4) rotate(-6deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes wiggle { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg) translateY(-6px); } }

@media (max-width: 900px) {
  .main { grid-template-columns: 1fr; }
  .tank { height: 58vh; min-height: 320px; }
  .cols { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .ray, .weed, .bubble, .reveal-card, .fishbig { animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <small>춘양중학교 사제동행 해양과학 캠프</small>
      <h1>행운의 <span>바다 낚시</span></h1>
    </div>
    <div class="tools">
      <button type="button" class="chip-btn" id="soundBtn" aria-pressed="true">소리 켜짐</button>
      <button type="button" class="chip-btn" id="fullBtn">전체 화면</button>
      <button type="button" class="chip-btn" id="setBtn" aria-expanded="false" aria-controls="settings">명단 설정</button>
    </div>
  </header>

  <div class="main">
    <div class="tank" id="tank" aria-label="학생 이름 물고기가 헤엄치는 수족관">
      <div class="ray" style="left:12%"></div>
      <div class="ray" style="left:46%;animation-delay:-3s"></div>
      <div class="ray" style="left:76%;animation-delay:-6s"></div>
      <div class="sand"></div>
      <div class="banner" id="banner">누가 낚일까요?</div>
      <div class="hook" id="hook" hidden><div class="line" id="hookLine"></div><svg id="hookSvg" viewBox="0 0 22 34" aria-hidden="true"><path d="M11 0 V22 a7 7 0 1 1 -8 -6" stroke="#f1f5f9" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M3 16 l-2 -5 l5 2" fill="#f1f5f9"/></svg></div>
      <div class="pool-count" id="poolCount"></div>
      <div class="empty" id="empty" hidden><span>모두 낚였어요!</span><small style="font-size:16px">설정에서 당첨 기록을 지우면 다시 시작할 수 있어요.</small></div>
    </div>

    <aside class="side">
      <section class="card" aria-label="추첨">
        <div class="prize-now">
          <span class="label">다음 차례</span>
          <b id="prizeName">1번째 행운의 물고기</b>
          <span id="prizeLeft"></span>
        </div>
        <button type="button" class="draw" id="drawBtn">낚싯대 던지기!</button>
        <p class="hint">스페이스바를 눌러도 추첨해요.</p>
      </section>
      <section class="card" aria-label="당첨자">
        <div class="row"><span class="label">당첨자 <b id="winCount">0</b>명</span><button type="button" class="mini" id="copyBtn">결과 복사</button></div>
        <ol class="winners" id="winners"></ol>
        <p class="hint" id="noWin">아직 당첨자가 없어요.</p>
      </section>
    </aside>
  </div>

  <section class="settings" id="settings" hidden aria-label="명단과 경품 설정">
    <h2>명단 설정</h2>
    <div style="display:grid;gap:10px;min-width:0">
      <label for="namesBox" class="label">참가자 명단 (한 줄에 한 명, 예: "2학년 송원", "선생님 홍길동")</label>
      <textarea id="namesBox" spellcheck="false"></textarea>
      <label class="check" for="excludeWin"><input type="checkbox" id="excludeWin" checked> 한 번 당첨된 사람은 다시 뽑지 않기</label>
    </div>
    <div class="row">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" class="btn main-btn" id="applyBtn">설정 적용</button>
        <button type="button" class="btn danger" id="resetBtn">당첨 기록 모두 지우기</button>
      </div>
      <p class="status" id="setStatus" aria-live="polite"></p>
    </div>
  </section>
</div>

<div class="reveal" id="reveal" hidden role="dialog" aria-modal="true" aria-labelledby="rvName">
  <div class="reveal-card">
    <svg class="fishbig" id="rvFish" viewBox="0 0 64 40" aria-hidden="true"></svg>
    <div class="prize" id="rvPrize"></div>
    <div class="congrats">낚였다! 축하합니다!</div>
    <div class="name" id="rvName"></div>
    <div class="grade" id="rvGrade"></div>
    <button type="button" class="btn main-btn close" id="rvClose">계속하기</button>
  </div>
</div>
<canvas class="confetti" id="confetti" hidden></canvas>

<script>
(function () {
  var DEFAULT_NAMES = [
    '1학년 권광현', '1학년 김규현', '1학년 김도윤', '1학년 김민서', '1학년 김세호', '1학년 김은수', '1학년 김채연', '1학년 박예찬', '1학년 변서영', '1학년 안대건', '1학년 임현빈', '1학년 전연태', '1학년 최수지',
    '2학년 권보연', '2학년 김체강', '2학년 김체린', '2학년 변연수', '2학년 송원', '2학년 여수진', '2학년 이서윤', '2학년 이성진', '2학년 이성해', '2학년 이소희', '2학년 이은경', '2학년 임혜리', '2학년 장대한', '2학년 정재윤', '2학년 최보미',
    '3학년 김가연', '3학년 김아영', '3학년 이민희', '3학년 이현진', '3학년 이현지'
  ];
  var COLORS = ['#ffb347', '#ff7a59', '#ff8fab', '#74c0fc', '#63e6be', '#ffd43b', '#b197fc', '#a9e34b', '#4dabf7', '#ffa8a8'];
  var KEY = 'chunyang-ocean-draw-v1';

  var state = { names: DEFAULT_NAMES.slice(), winners: [], exclude: true, sound: true };
  try { var saved = JSON.parse(localStorage.getItem(KEY) || 'null'); if (saved && Array.isArray(saved.names)) state = Object.assign(state, saved); } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  function parse(line) {
    var t = line.trim(); if (!t) return null;
    var m = t.match(/^(\d학년|선생님|교사)\s+(.+)$/);
    return m ? { group: m[1], name: m[2].trim(), raw: t } : { group: '', name: t, raw: t };
  }
  var people = [];
  function buildPeople() { people = state.names.map(parse).filter(Boolean).map(function (p, i) { p.id = i + ':' + p.raw; p.color = COLORS[i % COLORS.length]; return p; }); }
  function wonIds() { return state.winners.map(function (w) { return w.id; }); }
  function pool() { var won = state.exclude ? wonIds() : []; return people.filter(function (p) { return won.indexOf(p.id) < 0; }); }

  // ---------- 물고기 ----------
  function fishSvg(color) {
    return '<svg viewBox="0 0 64 40" aria-hidden="true">' +
      '<path d="M12 20 L1 8 Q4 20 1 32 Z" fill="' + color + '" opacity=".85"/>' +
      '<path d="M28 7 Q35 -1 42 6" fill="' + color + '"/>' +
      '<ellipse cx="35" cy="20" rx="24" ry="15" fill="' + color + '"/>' +
      '<path d="M22 9 q4 11 0 22" stroke="#ffffff55" stroke-width="2" fill="none"/>' +
      '<circle cx="47" cy="16" r="5" fill="#fff"/><circle cx="48.5" cy="16.5" r="2.6" fill="#0b1b2b"/><circle cx="49.4" cy="15.2" r="1" fill="#fff"/>' +
      '<ellipse cx="44" cy="25" rx="3.5" ry="2" fill="#ff5c8a" opacity=".55"/>' +
      '<path d="M53 23.5 q2.2 2 4.4 0" stroke="#0b1b2b" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>';
  }
  var tank = document.getElementById('tank');
  var fishes = [];
  var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function tankSize() { return { w: tank.clientWidth, h: tank.clientHeight }; }
  function makeFish() {
    fishes.forEach(function (f) { f.el.remove(); });
    fishes = [];
    var list = pool(), sz = tankSize();
    var n = Math.max(1, list.length);
    var scale = n > 50 ? .78 : n > 36 ? .88 : 1;
    if (sz.w < 600) scale *= .82;
    list.forEach(function (p, i) {
      var el = document.createElement('div');
      el.className = 'fish';
      el.style.setProperty('--w', Math.round(62 * scale) + 'px');
      el.style.setProperty('--fs', Math.round(15 * scale) + 'px');
      el.innerHTML = fishSvg(p.color) + '<span class="tag"></span>';
      el.querySelector('.tag').textContent = p.name;
      tank.appendChild(el);
      var speed = (22 + Math.random() * 26) * (Math.random() < .5 ? -1 : 1);
      var f = { p: p, el: el, x: Math.random() * Math.max(10, sz.w - 120) + 10, y: 60 + Math.random() * Math.max(10, sz.h * .78 - 70), vx: speed, base: Math.abs(speed), ph: Math.random() * 6.28, amp: 6 + Math.random() * 10, w: 0 };
      el.style.transform = 'translate(' + f.x.toFixed(1) + 'px,' + f.y.toFixed(1) + 'px)';
      fishes.push(f);
    });
    document.getElementById('poolCount').textContent = '수족관 속 물고기 ' + list.length + '마리';
    document.getElementById('empty').hidden = list.length > 0;
  }

  // ---------- 애니메이션 루프 ----------
  var mode = 'idle', t0 = 0, target = null, mult = 1, hookY = 0, hookX = 0;
  var hookEl = document.getElementById('hook'), hookLine = document.getElementById('hookLine'), hookSvg = document.getElementById('hookSvg');
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(.05, (now - last) / 1000); last = now;
    var sz = tankSize();
    var t = (now - t0);
    if (mode === 'frenzy') mult = 1 + 4 * Math.min(1, t / 500);
    else if (mult > 1) mult = Math.max(1, mult - dt * 3);
    fishes.forEach(function (f) {
      if (!f.w) f.w = f.el.offsetWidth || 80;
      if (f === target && mode !== 'idle' && mode !== 'frenzy') return;
      f.x += f.vx * mult * dt;
      f.ph += dt * (1.6 + mult * .8);
      if (f.x < 4) { f.x = 4; f.vx = Math.abs(f.vx); }
      if (f.x > sz.w - f.w - 4) { f.x = sz.w - f.w - 4; f.vx = -Math.abs(f.vx); }
      var yy = f.y + Math.sin(f.ph) * f.amp;
      yy = Math.max(46, Math.min(sz.h - 70, yy));
      f.el.style.transform = 'translate(' + f.x.toFixed(1) + 'px,' + yy.toFixed(1) + 'px)';
      f.el.classList.toggle('flip', f.vx < 0);
    });
    if (target && mode === 'approach') {
      var k = Math.min(1, t / 700), e = 1 - Math.pow(1 - k, 3);
      var tx = sz.w / 2 - target.w / 2, ty = sz.h * .55;
      target.cx = target.sx + (tx - target.sx) * e; target.cy = target.sy + (ty - target.sy) * e;
      place(target);
      if (k >= 1) { mode = 'hookdown'; t0 = now; hookX = sz.w / 2 + target.w * .18; hookEl.hidden = false; tone('plop'); }
    } else if (target && mode === 'hookdown') {
      var k2 = Math.min(1, t / 750), e2 = 1 - Math.pow(1 - k2, 2);
      hookY = (target.cy + 6) * e2; drawHook();
      target.cx += Math.sin(now / 60) * .6; place(target);
      if (k2 >= 1) { mode = 'bite'; t0 = now; target.el.classList.add('caught'); tone('bite'); }
    } else if (target && mode === 'bite') {
      target.el.style.transform = 'translate(' + target.cx.toFixed(1) + 'px,' + (target.cy + Math.sin(now / 40) * 4).toFixed(1) + 'px) rotate(' + (Math.sin(now / 50) * 10).toFixed(1) + 'deg)';
      if (t > 450) { mode = 'lift'; t0 = now; }
    } else if (target && mode === 'lift') {
      var k3 = Math.min(1, t / 900), e3 = k3 * k3;
      var y = target.cy - (target.cy + 160) * e3;
      hookY = y + 6; drawHook();
      target.el.style.transform = 'translate(' + target.cx.toFixed(1) + 'px,' + y.toFixed(1) + 'px) rotate(-75deg)';
      if (k3 >= 1) { mode = 'done'; hookEl.hidden = true; showReveal(); }
    }
    requestAnimationFrame(frame);
  }
  function place(f) { f.el.style.transform = 'translate(' + f.cx.toFixed(1) + 'px,' + f.cy.toFixed(1) + 'px)'; f.el.classList.remove('flip'); }
  function drawHook() {
    hookEl.style.transform = 'translateX(' + hookX.toFixed(1) + 'px)';
    hookLine.style.height = Math.max(0, hookY).toFixed(1) + 'px';
    hookSvg.style.top = Math.max(0, hookY - 2).toFixed(1) + 'px';
  }
  requestAnimationFrame(frame);

  // ---------- 추첨 ----------
  var drawBtn = document.getElementById('drawBtn'), banner = document.getElementById('banner');
  var pending = null;
  function rand(n) {
    try { var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; } catch (e) { return Math.floor(Math.random() * n); }
  }
  function draw() {
    if (mode !== 'idle' && mode !== 'done') return;
    var list = pool();
    if (!list.length) { banner.textContent = '남은 물고기가 없어요'; return; }
    var pick = list[rand(list.length)];
    target = fishes.filter(function (f) { return f.p.id === pick.id; })[0];
    pending = pick;
    drawBtn.disabled = true;
    if (calm || !target) { mode = 'done'; showReveal(); return; }
    mode = 'frenzy'; t0 = performance.now();
    // 이름이 빠르게 바뀌다가 점점 느려짐
    var delays = [], d = 60; for (var s = 0; d < 360; s++) { delays.push(d); d *= 1.12; }
    var i = 0;
    (function tick() {
      if (i < delays.length) {
        banner.textContent = list[rand(list.length)].name + '?';
        tone('tick');
        setTimeout(tick, delays[i++]);
      } else {
        banner.textContent = '덥석!';
        target.sx = currentX(target); target.sy = currentY(target);
        mode = 'approach'; t0 = performance.now();
      }
    })();
  }
  function currentX(f) { return f.x; }
  function currentY(f) { var m = /translate\([\d.-]+px,([\d.-]+)px\)/.exec(f.el.style.transform); return m ? +m[1] : f.y; }

  var reveal = document.getElementById('reveal');
  function showReveal() {
    var p = pending; if (!p) return;
    state.winners.push({ id: p.id, name: p.name, group: p.group, at: Date.now() });
    save();
    document.getElementById('rvFish').innerHTML = fishSvg(p.color).replace(/^<svg[^>]*>|<\/svg>$/g, '');
    document.getElementById('rvPrize').textContent = state.winners.length + '번째 행운의 물고기';
    document.getElementById('rvName').textContent = p.name;
    document.getElementById('rvGrade').textContent = p.group ? p.group : '';
    reveal.hidden = false;
    document.getElementById('rvClose').focus();
    tone('fanfare');
    confetti();
  }
  function closeReveal() {
    if (reveal.hidden) return;
    reveal.hidden = true; pending = null; target = null; mode = 'idle';
    banner.textContent = '누가 낚일까요?';
    drawBtn.disabled = false;
    makeFish(); renderSide();
  }
  document.getElementById('rvClose').addEventListener('click', closeReveal);
  drawBtn.addEventListener('click', draw);
  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (!reveal.hidden && (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape')) { e.preventDefault(); closeReveal(); return; }
    if (e.key === ' ' && document.activeElement !== drawBtn) { e.preventDefault(); draw(); }
  });

  // ---------- 오른쪽 패널 ----------
  function renderSide() {
    var left = pool().length;
    document.getElementById('prizeName').textContent = left ? (state.winners.length + 1) + '번째 행운의 물고기' : '모두 낚았어요!';
    document.getElementById('prizeLeft').textContent = '수족관에 ' + left + '마리 남았어요';
    drawBtn.disabled = mode !== 'idle' || !left;

    var ol = document.getElementById('winners'); ol.innerHTML = '';
    state.winners.slice().reverse().forEach(function (w, k) {
      var idx = state.winners.length - k;
      var li = document.createElement('li');
      var n = document.createElement('span'); n.className = 'n'; n.textContent = idx;
      var who = document.createElement('span'); who.className = 'who';
      var b = document.createElement('b'); b.textContent = w.name + (w.group ? ' ' : '');
      var g = document.createElement('span'); g.style.cssText = 'font-size:13px;color:var(--muted)'; g.textContent = w.group || '';
      who.appendChild(b); who.appendChild(g);
      var undo = document.createElement('button'); undo.type = 'button'; undo.className = 'mini'; undo.textContent = '되돌리기';
      undo.title = '자리에 없을 때 당첨을 취소하고 다시 수족관에 넣어요';
      undo.addEventListener('click', function () {
        if (undo.dataset.armed) { state.winners.splice(idx - 1, 1); save(); makeFish(); renderSide(); }
        else { undo.dataset.armed = '1'; undo.textContent = '정말 되돌리기'; undo.style.color = 'var(--coral)'; setTimeout(function () { if (undo.isConnected) { delete undo.dataset.armed; undo.textContent = '되돌리기'; undo.style.color = ''; } }, 3000); }
      });
      li.appendChild(n); li.appendChild(who); li.appendChild(undo);
      ol.appendChild(li);
    });
    document.getElementById('winCount').textContent = state.winners.length;
    document.getElementById('noWin').hidden = state.winners.length > 0;
  }
  document.getElementById('copyBtn').addEventListener('click', function () {
    var btn = this;
    var txt = '[춘양중학교 사제동행 해양과학 캠프 추첨 결과]\n' + state.winners.map(function (w, i) { return (i + 1) + '. ' + (w.group ? w.group + ' ' : '') + w.name; }).join('\n');
    var ok = function () { btn.textContent = '복사했어요'; setTimeout(function () { btn.textContent = '결과 복사'; }, 1500); };
    try { navigator.clipboard.writeText(txt).then(ok, function () { fallbackCopy(txt, btn); }); } catch (e) { fallbackCopy(txt, btn); }
  });
  function fallbackCopy(txt, btn) {
    var ta = document.getElementById('namesBox'); openSettings(true); ta.value = txt; ta.focus(); ta.select();
    document.getElementById('setStatus').textContent = '명단 칸에 결과를 넣었어요. 직접 복사한 뒤 "설정 적용" 대신 새로고침하면 명단이 돌아와요.';
    btn.textContent = '결과 복사';
  }

  // ---------- 설정 ----------
  var setBtn = document.getElementById('setBtn'), settings = document.getElementById('settings');
  function openSettings(force) {
    var open = force === true ? true : settings.hidden;
    settings.hidden = !open; setBtn.setAttribute('aria-expanded', String(open));
    if (open) { fillSettings(); settings.scrollIntoView({ behavior: calm ? 'auto' : 'smooth', block: 'start' }); }
  }
  setBtn.addEventListener('click', function () { openSettings(); });
  function fillSettings() {
    document.getElementById('namesBox').value = state.names.join('\n');
    document.getElementById('excludeWin').checked = !!state.exclude;
    document.getElementById('setStatus').textContent = '';
  }
  document.getElementById('applyBtn').addEventListener('click', function () {
    var names = document.getElementById('namesBox').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    if (!names.length) { document.getElementById('setStatus').textContent = '명단이 비어 있어요. 한 줄에 한 명씩 적어 주세요.'; return; }
    state.names = names; state.exclude = document.getElementById('excludeWin').checked;
    buildPeople();
    var ids = people.map(function (p) { return p.id; });
    state.winners = state.winners.filter(function (w) { return ids.indexOf(w.id) >= 0; });
    save(); makeFish(); renderSide();
    document.getElementById('setStatus').textContent = '적용했어요. 참가자 ' + people.length + '명';
  });
  var resetBtn = document.getElementById('resetBtn'), resetTimer = null;
  resetBtn.addEventListener('click', function () {
    if (!resetBtn.classList.contains('armed')) {
      resetBtn.classList.add('armed'); resetBtn.textContent = '한 번 더 누르면 모두 지워요';
      resetTimer = setTimeout(function () { resetBtn.classList.remove('armed'); resetBtn.textContent = '당첨 기록 모두 지우기'; }, 3000);
      return;
    }
    clearTimeout(resetTimer); resetBtn.classList.remove('armed'); resetBtn.textContent = '당첨 기록 모두 지우기';
    state.winners = []; save(); makeFish(); renderSide();
    document.getElementById('setStatus').textContent = '당첨 기록을 지웠어요. 모든 물고기가 수족관으로 돌아왔어요.';
  });

  // ---------- 소리 (버튼을 누른 뒤에만 재생) ----------
  var ac = null, soundBtn = document.getElementById('soundBtn');
  function setSoundLabel() { soundBtn.setAttribute('aria-pressed', String(state.sound)); soundBtn.textContent = state.sound ? '소리 켜짐' : '소리 꺼짐'; }
  soundBtn.addEventListener('click', function () { state.sound = !state.sound; save(); setSoundLabel(); });
  function beep(freq, dur, type, vol, when) {
    if (!state.sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      var t = ac.currentTime + (when || 0);
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol || .12, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + .02);
    } catch (e) {}
  }
  function tone(kind) {
    if (kind === 'tick') beep(700 + Math.random() * 300, .05, 'square', .05);
    else if (kind === 'plop') beep(300, .15, 'sine', .15);
    else if (kind === 'bite') { beep(520, .08, 'triangle', .15); beep(780, .1, 'triangle', .15, .08); }
    else if (kind === 'fanfare') [523, 659, 784, 1047].forEach(function (f, i) { beep(f, i === 3 ? .6 : .16, 'triangle', .16, i * .13); });
  }

  // ---------- 색종이 + 물방울 ----------
  var cv = document.getElementById('confetti'), cx = cv.getContext('2d');
  function confetti() {
    if (calm) return;
    cv.hidden = false;
    var W = cv.width = innerWidth * devicePixelRatio, H = cv.height = innerHeight * devicePixelRatio;
    var parts = [];
    for (var i = 0; i < 180; i++) {
      var bubble = i % 4 === 0;
      parts.push({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .55, vx: (Math.random() - .5) * 26 * devicePixelRatio, vy: (-12 - Math.random() * 16) * devicePixelRatio,
        r: (bubble ? 6 + Math.random() * 10 : 5 + Math.random() * 7) * devicePixelRatio, rot: Math.random() * 6, vr: (Math.random() - .5) * .3, bubble: bubble, c: COLORS[i % COLORS.length] });
    }
    var start = performance.now();
    (function step(now) {
      var t = now - start;
      cx.clearRect(0, 0, W, H);
      parts.forEach(function (p) {
        p.vy += (p.bubble ? -.05 : .45) * devicePixelRatio; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot);
        if (p.bubble) { cx.strokeStyle = '#e6f7ffcc'; cx.lineWidth = 2 * devicePixelRatio; cx.beginPath(); cx.arc(0, 0, p.r, 0, 6.29); cx.stroke(); }
        else { cx.fillStyle = p.c; cx.fillRect(-p.r, -p.r * .45, p.r * 2, p.r * .9); }
        cx.restore();
      });
      if (t < 3200) requestAnimationFrame(step); else { cx.clearRect(0, 0, W, H); cv.hidden = true; }
    })(start);
  }

  // ---------- 장식 ----------
  function decorate() {
    [[6, 70, '#2f9e44'], [10, 52, '#40c057'], [88, 80, '#2f9e44'], [92, 56, '#51cf66'], [52, 44, '#37b24d']].forEach(function (w, i) {
      var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      s.setAttribute('viewBox', '0 0 34 120'); s.setAttribute('class', 'weed');
      s.style.left = w[0] + '%'; s.style.height = w[1] * 1.6 + 'px'; s.style.animationDelay = (-i * .9) + 's';
      s.innerHTML = '<path d="M17 120 C4 95 30 78 17 55 S8 20 17 0" stroke="' + w[2] + '" stroke-width="9" fill="none" stroke-linecap="round"/>';
      tank.appendChild(s);
    });
    for (var i = 0; i < 14; i++) {
      var b = document.createElement('span'); b.className = 'bubble';
      var size = 6 + Math.random() * 14;
      b.style.cssText = 'left:' + (Math.random() * 100) + '%;width:' + size + 'px;height:' + size + 'px;animation-duration:' + (7 + Math.random() * 8) + 's;animation-delay:' + (-Math.random() * 12) + 's';
      tank.appendChild(b);
    }
  }

  document.getElementById('fullBtn').addEventListener('click', function () {
    var d = document.documentElement;
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (d.requestFullscreen) d.requestFullscreen().catch(function () {});
    } catch (e) {}
  });
  var resizeT; window.addEventListener('resize', function () { clearTimeout(resizeT); resizeT = setTimeout(function () { if (mode === 'idle') makeFish(); }, 200); });

  buildPeople(); decorate(); setSoundLabel(); makeFish(); renderSide();
})();
</script>
